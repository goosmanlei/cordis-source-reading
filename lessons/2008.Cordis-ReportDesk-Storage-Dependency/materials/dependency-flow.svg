<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#41566b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172a3a}.title{font-size:28px;font-weight:700}.body{font-size:18px}.small{font-size:15px;fill:#536679}</style><text x="40" y="45" class="title">同一个 report Fiber：随 storage 停用与恢复</text><text x="40" y="78" class="small">本例调用与稳定状态；箭头连接对应步骤，完整执行和等待边界见正文 M2。</text><text x="40" y="130" class="title">撤下 storage</text><rect x="40" y="160" width="580" height="124" rx="12" fill="#fff5ed" stroke="#b6c5d1"/><text x="62" y="193" class="body">storage.dispose()</text><text x="62" y="224" class="body">storage：ACTIVE → UNLOADING</text><text x="62" y="255" class="small">fiber.ts · _setEpoch / _updateState</text><path d="M330,285 V321" stroke="#41566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="325" width="580" height="124" rx="12" fill="#fff5ed" stroke="#b6c5d1"/><text x="62" y="358" class="body">notify([&quot;storage&quot;])</text><text x="62" y="389" class="body">report._checkImpl(&quot;storage&quot;)</text><text x="62" y="420" class="small">提供者不再 ACTIVE → 删除 _store.storage</text><path d="M330,450 V486" stroke="#41566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="490" width="580" height="124" rx="12" fill="#fff5ed" stroke="#b6c5d1"/><text x="62" y="523" class="body">report._refresh() → _setEpoch(INACTIVE)</text><text x="62" y="554" class="body">report._unload()：清理本轮服务</text><text x="62" y="585" class="small">fiber.ts · 389–418、447–467</text><path d="M330,615 V651" stroke="#41566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="655" width="580" height="124" rx="12" fill="#fff5ed" stroke="#b6c5d1"/><text x="62" y="688" class="body">report：PENDING，uid 保留</text><text x="62" y="719" class="body">store = undefined；本轮工作结束</text><text x="62" y="750" class="small">报告能力不可用；during 不创建 batch</text><text x="660" y="130" class="title">恢复 storage</text><rect x="660" y="160" width="580" height="124" rx="12" fill="#edf8f4" stroke="#b6c5d1"/><text x="682" y="193" class="body">app.plugin(storageProvider)</text><text x="682" y="224" class="body">新 storage：LOADING → ACTIVE</text><text x="682" y="255" class="small">新 Impl 与内存 Map；_updateState 发出通知</text><path d="M950,285 V321" stroke="#41566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="325" width="580" height="124" rx="12" fill="#edf8f4" stroke="#b6c5d1"/><text x="682" y="358" class="body">notify([&quot;storage&quot;])</text><text x="682" y="389" class="body">report._checkImpl(&quot;storage&quot;)</text><text x="682" y="420" class="small">新提供者已 ACTIVE → 保存 _store.storage</text><path d="M950,450 V486" stroke="#41566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="490" width="580" height="124" rx="12" fill="#edf8f4" stroke="#b6c5d1"/><text x="682" y="523" class="body">report._refresh() → 有效 epoch</text><text x="682" y="554" class="body">report._reload()：重新执行 apply</text><text x="682" y="585" class="small">先复制 store，再创建新的 ReportService</text><path d="M950,615 V651" stroke="#41566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="655" width="580" height="124" rx="12" fill="#edf8f4" stroke="#b6c5d1"/><text x="682" y="688" class="body">report：ACTIVE，原 uid 保留</text><text x="682" y="719" class="body">新 report 实例；新 storage 仍为空</text><text x="682" y="750" class="small">入口重新提交 after → 生成并保存两份报告</text><text x="40" y="856" class="body">身份保留 ≠ 服务实例保留；能力恢复后，业务由入口显式发起。</text></svg>