<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1370" viewBox="0 0 1440 1370" role="img" aria-label="业务时序：现有服务怎样共同处理一份输入">
<rect width="1440" height="1370" fill="#f8fafc"/>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#18324b;font-size:22px}.title{font-size:32px;font-weight:700}.small{font-size:19px}.head{font-size:24px;font-weight:700}</style>
<text x="40" y="48" class="title">业务时序：现有服务怎样共同处理一份输入</text>
<text x="40" y="85" class="small">实线为调用，虚线为返回。服务方法与格式回调同步；文件写入有显式 await。</text>
<rect x="40" y="115" width="1360" height="120" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="60" y="151" class="head">前置：reportBatch 已绑定本轮 report，report 已绑定 storage</text>
<text x="60" y="190" class="">服务视图带入调用 Context；方法接收者同时保留服务定义位置。方法调用复用已有实例。</text>
<text x="95" y="295" class="head">reportBatch</text>
<path d="M180 315 V1265" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<text x="385" y="295" class="head">report.generate</text>
<path d="M470 315 V1265" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<text x="705" y="295" class="head">格式回调</text>
<path d="M790 315 V1265" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<text x="995" y="295" class="head">storage</text>
<path d="M1080 315 V1265" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<text x="1225" y="295" class="head">观察插件</text>
<path d="M1310 315 V1265" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<path d="M180 365 L470 365" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="470,365 459.0,360.0 459.0,370.0" fill="#64748b"/>
<text x="230.0" y="353.0" class="small">generate(id, input)</text>
<path d="M470 435 L790 435" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="790,435 779.0,430.0 779.0,440.0" fill="#64748b"/>
<text x="515.0" y="423.0" class="small">waterfall(input, inner)</text>
<rect x="590" y="480" width="410" height="135" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="610" y="516" class="head">先进入，再加工返回</text>
<text x="610" y="555" class="">进入：quote → footer → render</text>
<text x="610" y="589" class="">返回：render → footer → quote</text>
<path d="M790 660 L470 660" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5"/>
<polygon points="470,660 481.0,665.0 481.0,655.0" fill="#64748b"/>
<text x="566.0" y="648.0" class="small">完整 Markdown</text>
<path d="M470 730 L1080 730" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="1080,730 1069.0,725.0 1069.0,735.0" fill="#64748b"/>
<text x="645.0" y="718.0" class="small">storage.save(id, markdown)</text>
<path d="M1080 795 L470 795" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5"/>
<polygon points="470,795 481.0,800.0 481.0,790.0" fill="#64748b"/>
<text x="702.5" y="783.0" class="small">内存 Map 已写入</text>
<path d="M470 855 L180 855" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5"/>
<polygon points="180,855 191.0,860.0 191.0,850.0" fill="#64748b"/>
<text x="251.5" y="843.0" class="small">Markdown 字符串</text>
<rect x="40" y="905" width="410" height="135" rx="12" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="60" y="941" class="head">await writeReport(...)</text>
<text x="60" y="980" class="">写入 alpha-lamp.md</text>
<text x="60" y="1014" class="">文件成功写出后继续</text>
<path d="M180 1110 L1310 1110" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="1310,1110 1299.0,1105.0 1299.0,1115.0" fill="#64748b"/>
<text x="560.0" y="1098.0" class="small">emit(report/completed, { id, title })</text>
<rect x="1025" y="1160" width="375" height="105" rx="12" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="1045" y="1196" class="head">同步通知与统计</text>
<text x="1045" y="1235" class="">观察者不改写报告返回值</text>
<text x="40" y="1310" class="small">这批业务返回后，batch Fiber 仍保留；它的结束由后续周期清理或 dispose 决定。</text>
<text x="40" y="1345" class="small">Cordis c261dd2 · 结构与中间阶段按固定源码归纳；本例快照及分支执行范围见 Notebook。</text>
</svg>