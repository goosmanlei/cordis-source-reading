<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1370" viewBox="0 0 1440 1370" role="img" aria-label="生命周期：一次装载可以经历多轮 apply">
<rect width="1440" height="1370" fill="#f8fafc"/>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#18324b;font-size:22px}.title{font-size:32px;font-weight:700}.small{font-size:19px}.head{font-size:24px;font-weight:700}</style>
<text x="40" y="48" class="title">生命周期：一次装载可以经历多轮 apply</text>
<text x="40" y="85" class="small">正常装载／关闭在本例运行；依赖恢复与配置更新仅作已学源码回顾。中间状态依据源码。</text>
<rect x="40" y="130" width="390" height="100" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="60" y="166" class="head">PENDING</text>
<text x="60" y="205" class="">等待必需依赖</text>
<rect x="525" y="130" width="390" height="100" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="545" y="166" class="head">LOADING</text>
<text x="545" y="205" class="">绑定本轮依赖，执行 apply</text>
<rect x="1010" y="130" width="390" height="100" rx="12" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="1030" y="166" class="head">ACTIVE</text>
<text x="1030" y="205" class="">本轮服务与资源可继续使用</text>
<path d="M430 180 L525 180" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="525,180 514.0,175.0 514.0,185.0" fill="#64748b"/>
<text x="458.5" y="168.0" class="small">就绪</text>
<path d="M915 180 L1010 180" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="1010,180 999.0,175.0 999.0,185.0" fill="#64748b"/>
<text x="943.5" y="168.0" class="small">完成</text>
<rect x="40" y="315" width="1360" height="105" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="60" y="351" class="head">一次业务调用返回</text>
<text x="60" y="390" class="">generate 返回、batch.apply 兑现，都不自动删除 Fiber；下一份输入可以继续使用同一服务。</text>
<rect x="40" y="500" width="420" height="545" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="60" y="536" class="head">依赖暂缺 → 恢复</text>
<text x="60" y="575" class="">storage 实现撤下</text>
<text x="60" y="609" class="">→ notify 检查相关 report Fiber</text>
<text x="60" y="643" class="">→ UNLOADING：释放旧一轮</text>
<text x="60" y="677" class="">→ PENDING：保留装载，等待</text>
<text x="60" y="711" class=""></text>
<text x="60" y="745" class="">storage 再就绪</text>
<text x="60" y="779" class="">→ LOADING：重新执行 apply</text>
<text x="60" y="813" class="">→ ACTIVE：新 ReportService</text>
<text x="60" y="847" class=""></text>
<text x="60" y="881" class="">同一 report Fiber，多轮 apply。</text>
<text x="60" y="915" class="">依赖 report 的 batch 也可能重跑。</text>
<rect x="510" y="500" width="420" height="545" rx="12" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="530" y="536" class="head">配置更新 → 默认重启</text>
<text x="530" y="575" class="">report Fiber.update(config)</text>
<text x="530" y="609" class="">→ 保存配置，默认 restart</text>
<text x="530" y="643" class="">→ revision 变化</text>
<text x="530" y="677" class="">→ UNLOADING：释放旧一轮</text>
<text x="530" y="711" class=""></text>
<text x="530" y="745" class="">→ LOADING：重新执行 apply</text>
<text x="530" y="779" class="">→ ACTIVE：新 ReportService</text>
<text x="530" y="813" class=""></text>
<text x="530" y="847" class="">同一 report Fiber，新配置。</text>
<text x="530" y="881" class="">storage 未撤下，可保留原对象。</text>
<text x="530" y="915" class="">本例没有拦截重启的更新监听。</text>
<rect x="980" y="500" width="420" height="545" rx="12" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="1000" y="536" class="head">最终 dispose</text>
<text x="1000" y="575" class="">关闭本次插件装载</text>
<text x="1000" y="609" class="">→ uid 置 null，移出 Runtime</text>
<text x="1000" y="643" class="">→ 清理本轮登记的资源</text>
<text x="1000" y="677" class="">→ DISPOSED</text>
<text x="1000" y="711" class=""></text>
<text x="1000" y="745" class="">父组关闭会释放子插件。</text>
<text x="1000" y="779" class="">最后一条装载移除后，</text>
<text x="1000" y="813" class="">该插件的 Runtime 也删除。</text>
<text x="1000" y="847" class=""></text>
<text x="1000" y="881" class="">再次 plugin 才产生新 Fiber。</text>
<text x="1000" y="915" class="">beta 与根部监听按各自归属清理。</text>
<rect x="40" y="1120" width="1360" height="165" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="60" y="1156" class="head">生命周期落实到资源：创建时登记释放动作，退出周期时执行</text>
<text x="60" y="1195" class="">provide / on / plugin → Fiber 收集清理；_unload 释放登记、监听、子插件及 apply 返回的清理函数。</text>
<text x="60" y="1229" class="">服务解除登记不等于立即回收对象；应用文件不会自动删除，新的内存服务也不会自动迁移旧数据。</text>
<text x="60" y="1263" class="">提供者变化沿依赖关系传播；父组关闭沿释放归属传播；它们共同使用 Fiber 的周期调度。</text>
<text x="40" y="1345" class="small">Cordis c261dd2 · 结构与中间阶段按固定源码归纳；本例快照及分支执行范围见 Notebook。</text>
</svg>