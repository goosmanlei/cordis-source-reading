<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1430" viewBox="0 0 1440 1430" role="img" aria-label="对象结构：共享的管理服务，与三种不同的关系">
<rect width="1440" height="1430" fill="#f8fafc"/>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#18324b;font-size:22px}.title{font-size:32px;font-weight:700}.small{font-size:19px}.head{font-size:24px;font-weight:700}</style>
<text x="40" y="48" class="title">对象结构：共享的管理服务，与三种不同的关系</text>
<text x="40" y="85" class="small">Context 决定访问位置；父子 Fiber 连接释放责任；服务依赖连接提供者与消费者。</text>
<rect x="40" y="115" width="1360" height="110" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="60" y="151" class="head">app：根 Context 的代理入口</text>
<text x="60" y="190" class="">根 Fiber（uid 0）管理应用装载；根部创建 registry、reflect、events 等共享管理服务。</text>
<rect x="40" y="290" width="430" height="190" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="60" y="326" class="head">RegistryService</text>
<text x="60" y="365" class="">callback → Runtime</text>
<text x="60" y="399" class="">Runtime.fibers → 多次装载</text>
<text x="60" y="433" class="">同一插件代码可安装多次</text>
<rect x="505" y="290" width="430" height="190" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="525" y="326" class="head">ReflectService</text>
<text x="525" y="365" class="">props → 属性访问规则</text>
<text x="525" y="399" class="">Symbol → Impl → 业务实例</text>
<text x="525" y="433" class="">局部映射选键，共享表保存实现</text>
<rect x="970" y="290" width="430" height="190" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="990" y="326" class="head">EventsService</text>
<text x="990" y="365" class="">事件名 → Hook[]</text>
<text x="990" y="399" class="">Hook 保存回调与登记 Context</text>
<text x="990" y="433" class="">派发与资源撤销分别有入口</text>
<path d="M255 225 L255 290" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="255,290 260.0,279.0 250.0,279.0" fill="#64748b"/>
<text x="263.0" y="245.5" class="small">持有</text>
<path d="M720 225 L720 290" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="720,290 725.0,279.0 715.0,279.0" fill="#64748b"/>
<text x="728.0" y="245.5" class="small">持有</text>
<path d="M1185 225 L1185 290" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="1185,290 1190.0,279.0 1180.0,279.0" fill="#64748b"/>
<text x="1193.0" y="245.5" class="small">持有</text>
<rect x="40" y="535" width="650" height="495" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="60" y="571" class="head">关系 A · Context 派生</text>
<rect x="65" y="610" width="245" height="100" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="85" y="646" class="head">app</text>
<text x="85" y="685" class="">根访问位置</text>
<rect x="395" y="610" width="270" height="100" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="415" y="646" class="head">alphaCtx</text>
<text x="415" y="685" class="">局部键与工作区名</text>
<path d="M310 660 L395 660" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>
<polygon points="395,660 384.0,655.0 384.0,665.0" fill="#2563eb"/>
<text x="333.5" y="648.0" class="small">派生</text>
<rect x="395" y="780" width="270" height="100" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="415" y="816" class="head">工作区插件的 ctx</text>
<text x="415" y="855" class="">拥有自己的 fiber 字段</text>
<path d="M530 710 L530 780" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>
<polygon points="530,780 535.0,769.0 525.0,769.0" fill="#2563eb"/>
<text x="538.0" y="733.0" class="small">派生</text>
<rect x="65" y="780" width="245" height="100" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="85" y="816" class="head">各子插件的 ctx</text>
<text x="85" y="855" class="">每个子插件各一份</text>
<path d="M395 830 L310 830" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>
<polygon points="310,830 321.0,835.0 321.0,825.0" fill="#2563eb"/>
<text x="320" y="810" class="small">派生</text>
<text x="65" y="940" class="small">虚线省略中间 Context 与代理；beta 另有同样一支。</text>
<text x="65" y="980" class="small">派生访问位置不会自动 new 一份业务服务。</text>
<rect x="730" y="535" width="670" height="495" rx="12" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="750" y="571" class="head">关系 B · Fiber 的释放归属</text>
<rect x="755" y="610" width="620" height="85" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="775" y="646" class="head">根 Fiber</text>
<text x="775" y="685" class="">父级持有子插件的 dispose</text>
<rect x="755" y="765" width="260" height="100" rx="12" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="775" y="801" class="head">四个共享插件 Fiber</text>
<text x="775" y="840" class="">格式 / 通知 / 统计</text>
<rect x="1060" y="765" width="315" height="100" rx="12" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="1080" y="801" class="head">workspace Fibers</text>
<text x="1080" y="840" class="">alpha 与 beta 各一条</text>
<path d="M885 695 L885 765" fill="none" stroke="#15803d" stroke-width="2.5"/>
<polygon points="885,765 890.0,754.0 880.0,754.0" fill="#15803d"/>
<text x="893.0" y="718.0" class="small">负责释放</text>
<path d="M1215 695 L1215 765" fill="none" stroke="#15803d" stroke-width="2.5"/>
<polygon points="1215,765 1220.0,754.0 1210.0,754.0" fill="#15803d"/>
<text x="1223.0" y="718.0" class="small">负责释放</text>
<rect x="1060" y="935" width="315" height="70" rx="12" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="1080" y="971" class="head">各组的三个子插件 Fiber</text>
<path d="M1215 865 L1215 935" fill="none" stroke="#15803d" stroke-width="2.5"/>
<polygon points="1215,935 1220.0,924.0 1210.0,924.0" fill="#15803d"/>
<text x="1223.0" y="888.0" class="small">负责释放</text>
<text x="755" y="935" class="small">三种子插件互为兄弟。</text>
<text x="755" y="975" class="small">共享监听不归 alpha 管理。</text>
<rect x="40" y="1080" width="1360" height="265" rx="12" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="60" y="1116" class="head">关系 C · 当前运行需要的服务</text>
<rect x="65" y="1160" width="340" height="100" rx="12" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="85" y="1196" class="head">batch Fiber</text>
<text x="85" y="1235" class="">inject: report</text>
<rect x="550" y="1160" width="340" height="100" rx="12" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="570" y="1196" class="head">report Fiber</text>
<text x="570" y="1235" class="">inject: storage</text>
<rect x="1035" y="1160" width="340" height="100" rx="12" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="1055" y="1196" class="head">storage Fiber</text>
<text x="1055" y="1235" class="">提供 StorageService</text>
<path d="M405 1210 L550 1210" fill="none" stroke="#b45309" stroke-width="2.5"/>
<polygon points="550,1210 539.0,1205.0 539.0,1215.0" fill="#b45309"/>
<text x="458.5" y="1198.0" class="small">依赖</text>
<path d="M890 1210 L1035 1210" fill="none" stroke="#b45309" stroke-width="2.5"/>
<polygon points="1035,1210 1024.0,1205.0 1024.0,1215.0" fill="#b45309"/>
<text x="943.5" y="1198.0" class="small">依赖</text>
<text x="65" y="1310" class="small">依赖变化从提供者影响消费者；声明依赖不会取得关闭提供者的所有权。</text>
<text x="40" y="1405" class="small">Cordis c261dd2 · 结构与中间阶段按固定源码归纳；本例快照及分支执行范围见 Notebook。</text>
</svg>