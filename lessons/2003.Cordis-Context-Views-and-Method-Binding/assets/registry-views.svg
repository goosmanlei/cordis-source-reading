<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc">
  <title id="title">两个访问视图，共享一个 Registry</title>
  <desc id="desc">root.extend 创建分支 A 和 B。两分支读取 registry 时，得到各自的访问视图。两个视图的 Proxy target 是同一 rawRegistry，它保存根 Context 和一张插件登记 Map。视图的 ctx 分别返回自己的分支。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647c"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #1c3047; font-size: 17px; }
      .title { font-size: 23px; font-weight: 650; }
      .strong { font-weight: 650; font-size: 19px; }
      .small { font-size: 15px; fill: #465970; }
      .box { stroke-width: 1.5; rx: 12; }
      .edge { fill: none; stroke: #52647c; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="510" fill="#f8fafc" rx="16"/>
  <text x="35" y="43" class="title">两个访问视图，共享一个 Registry</text>
  <text x="35" y="73" class="small">图中箭头说明对象创建、属性读取与持有关系；viewA / viewB 是 Proxy 包装对象。</text>

  <rect x="35" y="105" width="250" height="85" class="box" fill="#eaf0fb" stroke="#9bafcd"/>
  <text x="54" y="139" class="strong">root</text><text x="54" y="167" class="small">根 Context 的 Proxy</text>
  <rect x="35" y="255" width="250" height="80" class="box" fill="#e5f5ef" stroke="#75ad99"/>
  <text x="54" y="287" class="strong">branchA</text><text x="54" y="315" class="small">label = branch-A</text>
  <rect x="35" y="395" width="250" height="80" class="box" fill="#fff0dc" stroke="#c5a16e"/>
  <text x="54" y="427" class="strong">branchB</text><text x="54" y="455" class="small">label = branch-B</text>

  <rect x="405" y="255" width="225" height="80" class="box" fill="#e5f5ef" stroke="#75ad99"/>
  <text x="425" y="287" class="strong">viewA · 访问视图</text><text x="425" y="315">读取 ctx → branchA</text>
  <rect x="405" y="395" width="225" height="80" class="box" fill="#fff0dc" stroke="#c5a16e"/>
  <text x="425" y="427" class="strong">viewB · 访问视图</text><text x="425" y="455">读取 ctx → branchB</text>

  <rect x="760" y="105" width="280" height="130" class="box" fill="#edf0f8" stroke="#9bafcd"/>
  <text x="780" y="139" class="strong">rawRegistry · 原对象</text><text x="780" y="172">ctx = root</text><text x="780" y="205" class="small">原对象的 ctx 不随访问切换</text>
  <rect x="760" y="365" width="280" height="105" class="box" fill="#edf0f8" stroke="#9bafcd"/>
  <text x="780" y="400" class="strong">_internal · 登记 Map</text><text x="780" y="431" class="small">两视图读取到同一份数据</text>

  <path class="edge" d="M 285 143 L 760 143"/><text x="442" y="131" class="small">经根原对象的 registry 字段持有</text>
  <path class="edge" d="M 90 190 L 90 255"/><text x="101" y="226" class="small">extend 创建</text>
  <path class="edge" d="M 35 164 L 17 164 L 17 435 L 35 435"/>
  <path class="edge" d="M 285 295 L 405 295"/><text x="300" y="280" class="small">读取 registry</text>
  <path class="edge" d="M 285 435 L 405 435"/><text x="300" y="420" class="small">读取 registry</text>
  <path class="edge" d="M 630 290 L 700 290 L 700 190 L 760 190"/><text x="655" y="273" class="small">target</text>
  <path class="edge" d="M 630 440 L 720 440 L 720 213 L 760 213"/><text x="653" y="423" class="small">target</text>
  <path class="edge" d="M 900 235 L 900 365"/><text x="913" y="298" class="small">持有 _internal</text>
</svg>
