<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
  <title id="title">ReportDesk 第一次插件调用中的对象与数据</title>
  <desc id="desc">app.plugin 将 reportPlugin 与 config 交给 Registry。runtime 保存回调，fiber 保存本次配置和上下文，返回的 handle 以 fiber 为原型。执行时把 fiber.ctx 和配置传给 reportPlugin，业务写出报告。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526b88"/></marker></defs>
  <rect width="1040" height="470" rx="14" fill="#f5f8fc"/>
  <g font-family="sans-serif" fill="#142a43">
    <text x="30" y="38" font-size="23" font-weight="bold">一份配置如何交给报告插件</text>
    <g fill="#fff" stroke="#89a6c4" stroke-width="2">
      <rect x="30" y="80" width="270" height="98" rx="9"/>
      <rect x="370" y="80" width="285" height="98" rx="9"/>
      <rect x="728" y="80" width="280" height="98" rx="9"/>
      <rect x="370" y="283" width="285" height="137" rx="9"/>
      <rect x="728" y="300" width="280" height="104" rx="9"/>
      <rect x="30" y="298" width="270" height="100" rx="9"/>
    </g>
    <g font-size="18">
      <text x="48" y="112" font-weight="bold">app.plugin(...)</text>
      <text x="48" y="144">传入 reportPlugin 与 config</text>
      <text x="390" y="112" font-weight="bold">Registry 的 runtime 记录</text>
      <text x="390" y="145">callback → reportPlugin</text>
      <text x="748" y="112" font-weight="bold">本次 fiber</text>
      <text x="748" y="141">config · runtime · ctx</text>
      <text x="748" y="164">ctx 由 app.extend(...) 创建</text>
      <text x="390" y="318" font-weight="bold">reportPlugin(_ctx, config)</text>
      <text x="390" y="350">renderReport(config)</text>
      <text x="390" y="383">await writeReport(markdown)</text>
      <text x="748" y="335" font-weight="bold">handle（返回给应用）</text>
      <text x="748" y="365">await handle · dispose()</text>
      <text x="48" y="332" font-weight="bold">runs/reportdesk/report.md</text>
      <text x="48" y="363">本次生成的业务文件</text>
    </g>
    <g fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)">
      <path d="M300 125H366"/>
      <path d="M728 135H660"/>
      <path d="M869 300V183"/>
      <path d="M825 178V228H540V278"/>
      <path d="M370 350H306"/>
    </g>
    <g font-size="16" fill="#3b5776">
      <text x="308" y="112">登记</text>
      <text x="672" y="120">持有</text>
      <text x="882" y="252">以其为原型</text>
      <text x="477" y="215">装载执行时传入 fiber.ctx 与配置</text>
      <text x="309" y="337">写入</text>
      <text x="30" y="448">箭头分别标注登记、持有、传参与写入；业务文件不会因 handle.dispose() 自动删除。</text>
    </g>
  </g>
</svg>
