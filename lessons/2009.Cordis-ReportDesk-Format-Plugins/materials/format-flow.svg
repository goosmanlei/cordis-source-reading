<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs><marker id="call" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#176149"/></marker><marker id="ret" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#235cab"/></marker></defs>
<rect width="1600" height="1060" fill="#fff"/>
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#142a39} .title{font-size:30px;font-weight:700}.label{font-size:23px}.small{font-size:21px}</style>
<text x="50" y="52" class="title">formatted 批次：同一次 waterfall 的调用与返回</text>
<text x="50" y="93" class="small">绿箭头向内调用；蓝箭头把字符串返回给正在等待 next() 的那一层。全部为同步调用。</text>
<rect x="23" y="125" width="354" height="65" rx="12" fill="#edf3f7" stroke="#668396" stroke-width="2"/>
<text x="200" y="166" text-anchor="middle" class="label">ReportService.generate</text>
<path d="M200,190 V875" stroke="#a7b7c4" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="423" y="125" width="354" height="65" rx="12" fill="#edf3f7" stroke="#668396" stroke-width="2"/>
<text x="600" y="166" text-anchor="middle" class="label">quoteFormat 的监听器</text>
<path d="M600,190 V875" stroke="#a7b7c4" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="823" y="125" width="354" height="65" rx="12" fill="#edf3f7" stroke="#668396" stroke-width="2"/>
<text x="1000" y="166" text-anchor="middle" class="label">footerFormat 的监听器</text>
<path d="M1000,190 V875" stroke="#a7b7c4" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="1223" y="125" width="354" height="65" rx="12" fill="#edf3f7" stroke="#668396" stroke-width="2"/>
<text x="1400" y="166" text-anchor="middle" class="label">inner → renderReport</text>
<path d="M1400,190 V875" stroke="#a7b7c4" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M200,270 H600" stroke="#176149" stroke-width="4" marker-end="url(#call)" fill="none"/>
<text x="400.0" y="252" text-anchor="middle" class="label">① waterfall → dispatch → quote</text>
<path d="M600,370 H1000" stroke="#176149" stroke-width="4" marker-end="url(#call)" fill="none"/>
<text x="800.0" y="352" text-anchor="middle" class="label">② next() → dispatch → footer</text>
<path d="M1000,470 H1400" stroke="#176149" stroke-width="4" marker-end="url(#call)" fill="none"/>
<text x="1200.0" y="452" text-anchor="middle" class="label">③ next() → dispatch → inner()</text>
<path d="M1400,590 H1000" stroke="#235cab" stroke-width="4" marker-end="url(#ret)" fill="none"/>
<text x="1200.0" y="572" text-anchor="middle" class="label">④ 返回 B：原始正文</text>
<path d="M1000,700 H600" stroke="#235cab" stroke-width="4" marker-end="url(#ret)" fill="none"/>
<text x="800.0" y="682" text-anchor="middle" class="label">⑤ 返回 F：B + 统一页尾</text>
<path d="M600,810 H200" stroke="#235cab" stroke-width="4" marker-end="url(#ret)" fill="none"/>
<text x="400.0" y="792" text-anchor="middle" class="label">⑥ 返回 Q：逐行引用 F</text>
<rect x="50" y="900" width="1500" height="116" rx="12" fill="#f0f6ff" stroke="#7e9fc9" stroke-width="2"/>
<text x="80" y="938" class="label">generate 得到 Q 后才调用 storage.save(id, Q)，再返回给 reportBatch。</text>
<text x="80" y="979" class="label">reportBatch 写出快照后发出 report/completed；它不参与这条字符串返回链。</text>
</svg>
