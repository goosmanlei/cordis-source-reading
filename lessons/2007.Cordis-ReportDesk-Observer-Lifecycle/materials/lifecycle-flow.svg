<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#536778"/></marker></defs>
<rect width="1120" height="580" rx="18" fill="#f5f7fb"/>
<g font-family="system-ui, sans-serif" fill="#253746" font-size="17">
<text x="28" y="36" font-weight="700">登记：共享事件表保存监听，通知插件的 Fiber 保存清理入口</text>
<rect x="28" y="74" width="270" height="104" rx="10" fill="#e0edf8"/>
<text x="46" y="111">notificationPlugin(ctx)</text><text x="46" y="146">ctx.on("report/completed", …)</text>
<rect x="360" y="74" width="318" height="104" rx="10" fill="#e5eeeb"/>
<text x="378" y="109">EventsService.register</text><text x="378" y="142">通过 ctx.fiber.effect 执行登记</text>
<path d="M298 126 H354" stroke="#536778" fill="none" marker-end="url(#arrow)"/>
<rect x="832" y="74" width="260" height="104" rx="10" fill="#e5eeeb"/>
<text x="848" y="106">共享 _hooks</text><text x="848" y="135">["report/completed"]</text><text x="848" y="162">通知 Hook / 统计 Hook</text>
<path d="M678 113 H826" stroke="#536778" fill="none" marker-end="url(#arrow)"/><text x="700" y="99">push Hook</text>
<rect x="360" y="239" width="380" height="102" rx="10" fill="#ece7f6"/>
<text x="378" y="270">通知 Fiber._disposables</text><text x="378" y="300">保存本条监听的 wrapper</text><text x="378" y="324" font-size="15">其闭包收集 unregister 函数</text>
<path d="M505 178 V233" stroke="#536778" fill="none" marker-end="url(#arrow)"/><text x="520" y="208">登记清理入口</text>
<text x="28" y="395" font-weight="700">卸载：沿调用路径执行清理，只移除通知插件登记的那一项</text>
<rect x="28" y="426" width="240" height="90" rx="10" fill="#f8e9de"/><text x="44" y="460">await notification.dispose()</text><text x="44" y="491" font-size="15">结束该次插件装载</text>
<rect x="319" y="426" width="222" height="90" rx="10" fill="#f8e9de"/><text x="339" y="460">通知 Fiber._unload()</text><text x="339" y="491" font-size="15">clear 取出；map 中调用</text>
<rect x="592" y="426" width="198" height="90" rx="10" fill="#ece7f6"/><text x="610" y="460">wrapper()</text><text x="610" y="491" font-size="15">执行本组 dispose</text>
<rect x="841" y="426" width="251" height="90" rx="10" fill="#e5eeeb"/><text x="858" y="460">unregister(name, callback)</text><text x="858" y="491" font-size="15">按原 callback 引用移除 Hook</text>
<path d="M268 469 H313" stroke="#536778" fill="none" marker-end="url(#arrow)"/>
<path d="M541 469 H586" stroke="#536778" fill="none" marker-end="url(#arrow)"/>
<path d="M790 469 H835" stroke="#536778" fill="none" marker-end="url(#arrow)"/>
<path d="M690 341 V420" stroke="#536778" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>
<path d="M975 426 V185" stroke="#536778" fill="none" marker-end="url(#arrow)"/><text x="984" y="293" font-size="15">移除</text>
<text x="28" y="554" font-size="15">统计插件独立走同一条路径；两者都清理后该事件条目消失，重新装载再登记两个新回调。</text>
</g></svg>
